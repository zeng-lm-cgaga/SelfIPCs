name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run the complete C01-C23 crash matrix
        type: boolean
        default: true
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  automation-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test release identity, checksums, archive safety and publication guards
        run: python3 -m unittest discover -s test/automation -v
      - name: Check workflow definitions and shell syntax
        shell: bash
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --retry 3 --connect-timeout 10 --max-time 60 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757 "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck=
          bash -n scripts/ci.sh
          bash -n scripts/publish_release.sh

  optional-sdk:
    needs: automation-tests
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-linux
      - name: Install optional Asio dependency
        run: sudo apt-get install -y --no-install-recommends libboost-system-dev
      - name: Build and check affected optional lifetimes
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          out="$RUNNER_TEMP/selfipcs-optional"
          mkdir -p "$out"
          for mode in debug asan; do
            sanitizer=OFF
            if [[ "$mode" == asan ]]; then sanitizer=ON; fi
            cmake -S . -B "$out/$mode" -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON \
              -DSELFIPCS_BUILD_ASYNC=ON -DSELFIPCS_ENABLE_FAILPOINTS=ON \
              -DSELFIPCS_ENABLE_SANITIZERS="$sanitizer"
            cmake --build "$out/$mode" -j2
            ctest --test-dir "$out/$mode" --output-on-failure \
              --output-junit "$out/$mode.junit.xml" \
              -R 'AsyncClose\.|PoolMappingLifetime\.|PoolQueueTest\.|PoolLivenessRace\.|PoolWaitFeatureTest\.|SharedBufferPoolLayout\.|SharedBufferPoolIntegration\.|QueueFeatures\.|async_consume_demo|notification_service_configuration'
          done
          cmake -S . -B "$out/release" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DSELFIPCS_BUILD_ASYNC=ON -DSELFIPCS_ENABLE_FAILPOINTS=OFF \
            -DSELFIPCS_ENABLE_SANITIZERS=OFF
          cmake --build "$out/release" -j2
          cmake --install "$out/release" --prefix "$out/prefix"
          python3 scripts/check_optional_sdk.py --prefix "$out/prefix" \
            --output-root "$out" --with-async
      - name: Preserve optional SDK logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: optional-sdk-linux-${{ github.sha }}
          path: ${{ runner.temp }}/selfipcs-optional/
          if-no-files-found: warn
          retention-days: 14

  release-audit:
    needs: automation-tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      SELFIPCS_FULL: ${{ inputs.full || github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-linux
      - name: Debug, ASan/UBSan, Release and relocatable package consumers
        shell: bash
        run: |
          args=(--package --out-dir "$RUNNER_TEMP/selfipcs-ci")
          if [[ "$SELFIPCS_FULL" == true ]]; then args+=(--full); fi
          bash scripts/ci.sh "${args[@]}"
      - name: Upload transcripts, JUnit and crash evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-audit-logs-${{ matrix.os }}
          path: ${{ runner.temp }}/selfipcs-ci/run-*/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload tested Ubuntu 22.04 release assets
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: selfipcs-release-assets
          path: ${{ runner.temp }}/selfipcs-ci/packages/
          if-no-files-found: error
          retention-days: 14
