name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run the complete C01-C23 crash matrix
        type: boolean
        default: true
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  automation-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test release identity, checksums, archive safety and publication guards
        run: python3 -m unittest discover -s test/automation -v

  release-audit:
    needs: automation-tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      SELFIPCS_FULL: ${{ inputs.full || github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-linux
      - name: Debug, ASan/UBSan, Release and relocatable package consumers
        shell: bash
        run: |
          args=(--package --out-dir "$RUNNER_TEMP/selfipcs-ci")
          if [[ "$SELFIPCS_FULL" == true ]]; then args+=(--full); fi
          bash scripts/ci.sh "${args[@]}"
      - name: Upload transcripts, JUnit and crash evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-audit-logs-${{ matrix.os }}
          path: ${{ runner.temp }}/selfipcs-ci/run-*/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload tested Ubuntu 22.04 release assets
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: selfipcs-release-assets
          path: ${{ runner.temp }}/selfipcs-ci/packages/
          if-no-files-found: error
          retention-days: 14
