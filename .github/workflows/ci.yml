# CI — the SelfIPCs release-audit gate (design §26 completion definition).
#
# Same stages as scripts/ci.sh, run on a clean ubuntu-22.04 runner with the
# required toolchain and GoogleTest development package. A green run on the
# default branch is the evidence that the tree builds clean, all tests pass under dev-debug and
# ASan/UBSan, release compiles failpoints out, and the installed package is
# consumable by an independent downstream project.
#
#   scripts/ci.sh owns the ordered debug, sanitizer, Release install, and
#   external downstream-consumer stages.
#
# Full crash matrix (C01-C23) and the ER7 12-run benchmark evidence set are
# opt-in on the development host, not part of per-commit CI (see design §20.3
# and §21). CI runs the same default ctest suite the presets ship.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  release-audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake libgtest-dev python3

      - name: Prepare per-user runtime directory
        run: |
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" "/run/user/$(id -u)"

      - name: Release audit and independent downstream consumer
        run: scripts/ci.sh --out-dir "$RUNNER_TEMP/selfipcs-ci"

      - name: Upload release audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-audit-logs
          path: ${{ runner.temp }}/selfipcs-ci/
          if-no-files-found: ignore
          retention-days: 7
